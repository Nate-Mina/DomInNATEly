name: Notify Portfolio of Updates

on:
  push:
    branches:
      - main
      - master

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync in Portfolio repository
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PORTFOLIO_SYNC_PAT }}" \
            https://api.github.com/repos/Nate-Mina/Portfolio-CV/dispatches \
            -d '{"event_type": "dominnately-updated"}'

