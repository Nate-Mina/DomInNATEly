name: Notify Portfolio of Updates

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger sync in Portfolio repository
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PORTFOLIO_SYNC_PAT }}" \
            https://api.github.com/repos/Nate-Mina/Portfolio-CV/dispatches \
            -d '{"event_type": "dominnately-updated"}'

